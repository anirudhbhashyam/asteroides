<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <title>Asteroides</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #090812;
            color: #e2e8f0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }
        #status {
            margin-bottom: 8px;
            font-size: 13px;
            color: #38bdf8;
            min-height: 18px;
        }
        canvas.emscripten {
            flex: none;
            width: min(96vw, calc((100vh - 64px) * 16 / 9));
            height: auto;
            aspect-ratio: 16 / 9;
            border: 2px solid #1e293b;
            border-radius: 6px;
            background-color: #000000;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
            outline: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="status">Loading Asteroides...</div>
    <canvas class="emscripten" id="canvas" tabindex="-1"></canvas>
    <script src="bootstrap.js"></script>

</html>
