<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <title>Asteroides</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #090812;
            color: #e2e8f0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }
        #status {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 13px;
            color: #38bdf8;
            z-index: 1;
            pointer-events: none;
        }
        /* raylib resizes the canvas buffer to the window; the game letterboxes 16:9 itself. */
        canvas.emscripten {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            border: 0;
            outline: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="status">Loading Asteroides...</div>
    <canvas class="emscripten" id="canvas" tabindex="-1"></canvas>
    <script src="bootstrap.js"></script>
    {{{ SCRIPT }}}
</body>
</html>
